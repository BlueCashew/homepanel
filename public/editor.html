<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Beginscherm indelen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<style>
/* Aanvullingen voor de editor; tegels en thema's komen uit style.css. */
html, body { overflow: hidden; }
body { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
.ed-top { position: absolute; left: 0; right: 0; top: 0; height: 76px; z-index: 2; }
.ed-btn { position: absolute; top: 16px; height: 44px; line-height: 44px; padding: 0 20px; border-radius: 22px; font-size: 17px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,.2); color: inherit; }
.ed-btn.is-down, .ed-tool.is-down, .pk-item.is-down { opacity: .6; }
.ed-cancel { left: 24px; }
.ed-save { right: 24px; background: #fff; color: #2b2210; }
.ed-tabs { position: absolute; left: 170px; right: 150px; top: 16px; height: 44px; text-align: center; white-space: nowrap; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.ed-tab { display: inline-block; height: 44px; line-height: 44px; padding: 0 16px; margin: 0 3px; border-radius: 22px; font-size: 16px; font-weight: 600; cursor: pointer; opacity: .75; }
.ed-tab.is-on { opacity: 1; background: rgba(255,255,255,.22); }
.ed-tab.ed-add { opacity: .9; border: 2px dashed rgba(255,255,255,.45); line-height: 40px; }
body.theme-zand .ed-tab.is-on { background: rgba(45,38,29,.1); }
body.theme-zand .ed-tab.ed-add { border-color: rgba(45,38,29,.3); }
.pk-back { display: none; position: absolute; left: 14px; top: 14px; height: 42px; line-height: 42px; padding: 0 16px; border-radius: 21px; background: rgba(255,255,255,.12); font-size: 16px; font-weight: 600; cursor: pointer; }
.pk-box.is-sub .pk-back { display: block; }
.pk-box.is-sub .pk-title { left: 130px; }
.pk-cat { position: relative; height: 72px; line-height: 72px; padding-left: 66px; margin-bottom: 8px; border-radius: 18px; background: rgba(255,255,255,.08); font-size: 19px; font-weight: 600; cursor: pointer; }
.pk-cat svg { position: absolute; left: 20px; top: 22px; width: 28px; height: 28px; }
.pk-cat small { font-size: 14px; font-weight: 400; opacity: .6; margin-left: 10px; }
.pk-cat:after { content: "›"; position: absolute; right: 22px; top: 0; font-size: 30px; opacity: .5; }
.pk-cat.is-down { opacity: .6; }
.ed-title { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 22px; line-height: 40px; font-weight: 600; pointer-events: none; }
.ed-hint { position: absolute; left: 0; right: 0; top: 54px; text-align: center; font-size: 13px; opacity: .8; pointer-events: none; }
#area { position: absolute; left: 0; right: 0; top: 76px; bottom: 96px; z-index: 1; }
.cell { position: absolute; border-radius: 22px; border: 2px dashed rgba(255,255,255,.4); -webkit-box-sizing: border-box; box-sizing: border-box; cursor: pointer; }
.cell:after { content: "+"; position: absolute; left: 0; right: 0; top: 50%; margin-top: -22px; text-align: center; font-size: 36px; line-height: 44px; font-weight: 200; opacity: .6; }
.cell.is-target { border-color: #fff; border-style: solid; background: rgba(255,255,255,.12); }
.cell.is-target:after { opacity: 1; }
body.theme-zand .cell { border-color: rgba(45,38,29,.28); color: #2d261d; }
body.theme-zand .cell.is-target { border-color: #2d261d; background: rgba(45,38,29,.06); }
body.theme-zand .ed-btn, body.theme-zand .ed-tool:not(.is-on):not(.danger) { background: rgba(45,38,29,.08); }
body.theme-zand .ed-tool.is-on, body.theme-zand .ed-save { background: #2d261d; color: #fff; }
body.mode-dark.theme-zand .ed-btn, body.mode-dark.theme-zand .ed-tool:not(.is-on):not(.danger) { background: rgba(255,255,255,.12); }
body.mode-dark.theme-zand .ed-tool.is-on, body.mode-dark.theme-zand .ed-save { background: #e9dcc6; color: #2a2218; }
body.mode-dark.theme-zand .cell { border-color: rgba(255,255,255,.3); color: #ece6dc; }
#area .tile { cursor: pointer; }
#area .tile.is-sel { box-shadow: 0 0 0 4px #fff, 0 10px 30px rgba(0,0,0,.25) !important; }
#area .tile.is-moving { opacity: .55; }
.ed-size { position: absolute; right: 14px; bottom: 12px; font-size: 13px; font-weight: 700; opacity: .65; }
.s-1xh .ed-kind, .s-2xh .ed-kind { display: none; }
.s-1xh .ed-size, .s-2xh .ed-size { top: 50%; bottom: auto; margin-top: -9px; line-height: 18px; }
.s-1xh .t-name, .s-2xh .t-name { right: 44px; margin-top: -11px; }
body.theme-zand #area .tile.is-sel { box-shadow: 0 0 0 4px #2d261d, 0 10px 30px rgba(0,0,0,.15) !important; }
.cell.is-half { border-radius: 60px; }
.cell.is-half:after { font-size: 26px; line-height: 30px; margin-top: -15px; }
.ed-kind { position: absolute; left: 20px; bottom: 17px; font-size: 14px; opacity: .8; }
#bar.ed-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; z-index: 2; text-align: center; }
.ed-tools { display: inline-block; margin-top: 20px; white-space: nowrap; }
.ed-tool { display: inline-block; height: 52px; line-height: 52px; padding: 0 18px; margin: 0 4px; border-radius: 18px; font-size: 16px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,.2); }
.ed-tool.is-on { background: #fff; color: #2b2210; }
.ed-tool.is-off { opacity: .3; }
.ed-tool.danger { background: rgba(200,60,50,.85); color: #fff; }
.ed-msg { margin-top: 34px; font-size: 16px; opacity: .85; }
.ed-msg-small { margin-top: 6px; font-size: 13px; opacity: .7; }
.ed-tools + .ed-msg-small { margin-top: 4px; }
#picker { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 5; background: rgba(8,10,16,.55); }
#picker.is-shown { display: block; }
.pk-box { position: absolute; left: 50%; top: 40px; bottom: 40px; width: 620px; margin-left: -310px; border-radius: 28px; background: #26324a; color: #f4f0e6; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.pk-head { position: absolute; left: 0; right: 0; top: 0; height: 70px; }
.pk-title { position: absolute; left: 26px; top: 20px; font-size: 22px; font-weight: 600; }
.pk-close { position: absolute; right: 18px; top: 14px; height: 42px; line-height: 42px; padding: 0 18px; border-radius: 21px; background: rgba(255,255,255,.12); font-size: 16px; font-weight: 600; cursor: pointer; }
.pk-list { position: absolute; left: 0; right: 0; top: 70px; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 18px 18px 18px; }
.pk-group { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; opacity: .6; margin: 18px 8px 8px 8px; }
.pk-item { position: relative; height: 56px; line-height: 56px; padding-left: 58px; margin-bottom: 6px; border-radius: 16px; background: rgba(255,255,255,.07); font-size: 17px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-item svg { position: absolute; left: 18px; top: 16px; width: 24px; height: 24px; }
.pk-item small { opacity: .6; margin-left: 8px; font-size: 14px; }
.pk-item.is-used { opacity: .45; }
/* Groep maken of wijzigen */
.pk-foot { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 14px 18px 0 18px; -webkit-box-sizing: border-box; box-sizing: border-box; background: #26324a; box-shadow: 0 -8px 20px rgba(0,0,0,.18); }
.pk-box.is-group .pk-foot { display: block; }
.pk-box.is-group .pk-list { bottom: 84px; }
.pk-save { display: inline-block; height: 56px; line-height: 56px; padding: 0 22px; border-radius: 18px; background: #fff; color: #2b2210; font-size: 17px; font-weight: 600; cursor: pointer; }
.pk-save.is-off { opacity: .4; }
.pk-save.pk-del { float: right; background: rgba(200,60,50,.85); color: #fff; }
.pk-save.is-down { opacity: .6; }
.pk-name { display: block; width: 100%; height: 56px; margin-top: 4px; padding: 0 18px; border: 0; border-radius: 16px; background: rgba(255,255,255,.12); color: #f4f0e6; font-size: 18px; -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-appearance: none; outline: none; }
.pk-name::-webkit-input-placeholder { color: rgba(244,240,230,.45); }
.pk-hint { margin: 10px 8px 0 8px; font-size: 14px; line-height: 19px; opacity: .65; }
.pk-check { padding-left: 60px; }
.pk-check:before { content: ""; position: absolute; left: 18px; top: 15px; width: 22px; height: 22px; border-radius: 7px; border: 2px solid rgba(255,255,255,.4); }
.pk-check.is-on { background: rgba(111,211,168,.18); }
.pk-check.is-on:before { background: #6fd3a8; border-color: #6fd3a8; }
.pk-check.is-on:after { content: ""; position: absolute; left: 26px; top: 19px; width: 6px; height: 11px; border: solid #17261f; border-width: 0 3px 3px 0; -webkit-transform: rotate(45deg); transform: rotate(45deg); }
@media (max-width: 700px) {
  .pk-box { left: 10px; right: 10px; width: auto; margin-left: 0; }
  .ed-tabs { left: 120px; right: 110px; }
  .ed-tab { padding: 0 10px; font-size: 14px; }
  .ed-tool { padding: 0 10px; margin: 0 2px; font-size: 14px; }
}
</style>
</head>
<body class="theme-warm">
<script>/* Laatst gebruikte thema meteen zetten, zodat er bij laden geen ander thema doorheen flitst. */try{var c=window.localStorage.getItem("hp-theme");if(c){document.body.className=c;}}catch(e){}</script>
<div class="ed-top">
  <div class="ed-btn ed-cancel" id="cancel">Annuleren</div>
  <div class="ed-tabs" id="tabs"></div>
  <div class="ed-btn ed-save" id="save">Opslaan</div>
</div>
<div id="area"></div>
<div class="ed-bar" id="bar"></div>
<div id="picker"><div class="pk-box" id="pk-box"><div class="pk-head"><div class="pk-back" id="pk-back">‹ Terug</div><div class="pk-title" id="pk-title">Wat komt hier?</div><div class="pk-close" id="pk-close">Sluiten</div></div><div class="pk-list" id="pk-list"></div><div class="pk-foot" id="pk-foot"></div></div></div>
<div id="offline"></div>
<script src="editor.js"></script>
</body>
</html>
