<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Huispaneel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Huis">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-warm">
<script>/* Laatst gebruikte thema meteen zetten, zodat er bij laden geen ander thema doorheen flitst. */try{var c=window.localStorage.getItem("hp-theme");if(c){document.body.className=c;}}catch(e){}</script>
<div id="stage"><div id="track"></div></div>

<div id="bar">
  <div id="dots"></div>
  <div class="barbtn" id="edit" title="Beginscherm indelen"></div>
  <div class="barbtn" id="gear" title="Instellingen"></div>
</div>
<div id="offline">Geen verbinding met het paneel</div>

<div id="sheet">
  <div class="sheet-box">
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-value" id="sheet-value"></div>
    <div class="slider slider-big" id="sheet-slider"><div class="slider-fill"></div><div class="slider-knob"></div></div>
    <div class="sheet-sub">Kleurtemperatuur</div>
    <div class="slider slider-big slider-ct" id="sheet-ct"><div class="slider-fill"></div><div class="slider-knob"></div></div>
    <div class="stepper">
      <div class="step-btn" id="step-minus">&minus;</div>
      <div class="step-val" id="step-val"></div>
      <div class="step-btn step-plus" id="step-plus">+</div>
    </div>
    <div class="sheet-row">
      <div class="sheet-btn" id="sheet-no">Sluiten</div>
      <div class="sheet-btn sheet-primary" id="sheet-yes"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
